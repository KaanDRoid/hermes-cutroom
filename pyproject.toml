[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-cutroom"
version = "0.1.1"
description = "Local, non-destructive video editing for Hermes Agent"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kaan"}]
dependencies = []

[project.optional-dependencies]
dev = ["fastapi==0.162.2", "httpx==0.28.1", "numpy>=2,<3", "pillow>=12,<14", "ruff>=0.14"]
speech = ["faster-whisper==1.2.1"]
vision = ["mediapipe==1.2.2", "pillow>=12,<14"]
integrations = ["yt-dlp==2026.10.26"]

[project.scripts]
cutroom = "cutroom.cli:main"

[tool.setuptools.packages.find]
include = ["cutroom*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
