[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-cutroom"
version = "0.1.0"
description = "Local, non-destructive video editing for Hermes Agent"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kaan"}]
dependencies = []

[project.scripts]
cutroom = "cutroom.cli:main"

[tool.setuptools.packages.find]
include = ["cutroom*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
