name: Core compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s tests -v
      - name: Preserve workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-evidence-${{ matrix.python-version }}
          path: artifacts/
