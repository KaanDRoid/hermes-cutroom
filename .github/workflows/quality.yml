name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check cutroom dashboard tests
      - name: Python tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s tests -v
      - name: Desktop contract tests
        run: node --test tests/desktop-check.mjs
      - name: Preserve synthetic workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-evidence-${{ matrix.os }}
          path: artifacts/
